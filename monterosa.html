<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie-Based Text</title>
    <script>
        // Function to get the value of a cookie by name
        function getCookie(name) {
            const cookies = document.cookie.split('; ');
            for (let i = 0; i < cookies.length; i++) {
                const [key, value] = cookies[i].split('=');
                if (key === name) {
                    return decodeURIComponent(value);
                }
            }
            return null;
        }

        // Function to display text based on the cookie
        function displayTextFromCookie() {
            const text = getCookie('theToken');
            const displayElement = document.getElementById('textDisplay');
            if (text) {
                displayElement.textContent = text;
            } else {
                displayElement.textContent = document.cookie;
            }
        }

        // Function to send a post message "tokenExpired"
        function sendTokenExpiredMessage() {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tokenExpired) {
                window.webkit.messageHandlers.tokenExpired.postMessage(null);
            } else {
                console.error("The message handler 'tokenExpired' is not available.");
            }
        }

        window.addEventListener("message", function(event) {
            const text = getCookie('theToken');
            const displayElement = document.getElementById('textDisplay');
            if (text) {
                displayElement.textContent = text;
            } else {
                displayElement.textContent = document.cookie;
            }
        });

        // Run the function when the page loads
        window.onload = function () {
            if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
                document.getElementById('textDisplay').textContent = "Page was refreshed!";
                // Add your refresh-specific logic here
            } else {
                console.log("Page loaded normally.");
            }
        };
    </script>
</head>
<body>
    <h1>Cookie-Based Text Display</h1>
    <p id="textDisplay">Loading...</p>
    <button onclick="sendTokenExpiredMessage()">Send Token Expired</button>
</body>
</html>

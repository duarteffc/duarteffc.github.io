<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie-Based Text</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#202020, #000000);
            background-attachment: fixed;
            /* Ensures the gradient doesn't scroll */
            color: white;
            min-height: 100vh;
            /* Ensures the gradient covers the full viewport height */
        }

        h1,
        p {
            text-align: center;
        }

        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #666;
        }
    </style>
    <script>
        // Function to get the value of a cookie by name
        function getCookie(name) {
            const cookies = document.cookie.split('; ');
            for (let i = 0; i < cookies.length; i++) {
                const [key, value] = cookies[i].split('=');
                if (key === name) {
                    return decodeURIComponent(value);
                }
            }
            return null;
        }

        // Function to display text based on the cookie
        function displayTextFromCookie() {
            const text = getCookie('theToken');
            const displayElement = document.getElementById('textDisplay');
            if (window.monterosaMessage) {
                const parentDisplayElement = document.getElementById('parentDisplay');
                parentDisplayElement.textContent = "Parent bro window is available.";
            }
            if (text) {
                displayElement.textContent = text;
            } else {
                displayElement.textContent = document.cookie;
            }
        }

        // Function to send a post message "monterosaMessage"
        function sendMonterosaMessage() {
            const msg = {
                action: "User Auth Token Refresh",
                identifier: "token-refresh",
                payload: {
                    reason: "token-expired",
                    message: "User login token expired"
                }
            };
            if (window.monterosaMessage) {
                window.monterosaMessage.postMessage(JSON.stringify(msg));
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monterosaMessage) {
                window.webkit.messageHandlers.monterosaMessage.postMessage(JSON.stringify(msg));
            } else if (!(window.monterosaMessage)) {
                console.error("The message handler 'monterosaMessage' is not available.");
            }
        }

        // New event: Backend error
        function sendBackendError() {
            const msg = {
                action: "Application Error",
                identifier: "application-error",
                payload: {
                    reason: "backend-error",
                    message: "Application failed to fetch cards from backend"
                }
            };
            if (window.monterosaMessage) {
                window.monterosaMessage.postMessage(JSON.stringify(msg));
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monterosaMessage) {
                window.webkit.messageHandlers.monterosaMessage.postMessage(JSON.stringify(msg));
            }
        }

        // New event: Logic error
        function sendLogicError() {
            const msg = {
                action: "Application Error",
                identifier: "application-error",
                payload: {
                    reason: "logic-error",
                    message: "Application encountered an error whilst selecting a card"
                }
            };
            if (window.monterosaMessage) {
                window.monterosaMessage.postMessage(JSON.stringify(msg));
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monterosaMessage) {
                window.webkit.messageHandlers.monterosaMessage.postMessage(JSON.stringify(msg));
            }
        }

        // New event: UI error
        function sendUiError() {
            const msg = {
                action: "Application Error",
                identifier: "application-error",
                payload: {
                    reason: "ui-error",
                    message: "No cards to show"
                }
            };
            if (window.monterosaMessage) {
                window.monterosaMessage.postMessage(JSON.stringify(msg));
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monterosaMessage) {
                window.webkit.messageHandlers.monterosaMessage.postMessage(JSON.stringify(msg));
            }
        }

        // New event: Experience status
        function sendExperienceStatus() {
            const msg = {
                action: "Application Status Report",
                identifier: "application-status",
                payload: {
                    reason: "event-not-started",
                    message: "Event status error i.e event not started"
                }
            };
            if (window.monterosaMessage) {
                window.monterosaMessage.postMessage(JSON.stringify(msg));
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monterosaMessage) {
                window.webkit.messageHandlers.monterosaMessage.postMessage(JSON.stringify(msg));
            }
        }

        window.addEventListener("message", function (event) {
            const text = getCookie('theToken');
            const displayElement = document.getElementById('textDisplay');
            if (text) {
                displayElement.textContent = text;
            } else {
                displayElement.textContent = document.cookie;
            }
        });

        // Run the function when the page loads
        window.onload = function () {
            if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
                document.getElementById('textDisplay').textContent = "Page was refreshed!";
                // Add your refresh-specific logic here
            } else {
                console.log("Page loaded normally.");
            }
        };
    </script>
</head>

<body>
    <h1>Cookie-Based Text Display</h1>
    <p id="textDisplay">Loading...</p>
    <p id="parentDisplay">No parent bro</p>
    <button onclick="sendMonterosaMessage()">Send Token Expired</button>
    <button onclick="displayTextFromCookie()">Read Cookie</button>
    <!-- New buttons for events -->
    <button onclick="sendBackendError()">Send Backend Error</button>
    <button onclick="sendLogicError()">Send Logic Error</button>
    <button onclick="sendUiError()">Send UI Error</button>
    <button onclick="sendExperienceStatus()">Send Experience Status</button>
</body>

</html>
